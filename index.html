<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>再放一个就走</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#ede9e2;color:#273b40;font-family:system-ui,-apple-system,sans-serif}body{display:grid;place-items:center}main{width:min(100%,440px);height:100dvh;max-height:920px;position:relative;background:#faf7ef;overflow:hidden;box-shadow:0 0 70px #30434212}header{position:absolute;top:max(20px,env(safe-area-inset-top));left:25px;right:25px;display:flex;justify-content:space-between;z-index:2;pointer-events:none}small{display:block;font-size:10px;letter-spacing:2px;color:#7b8987}b{font-size:28px;font-weight:650}button{font:inherit;cursor:pointer;border:0}#pause{pointer-events:auto;background:transparent;color:#73827f;font-size:20px;padding:10px}canvas{width:100%;height:100%;touch-action:none;display:block}#overlay{position:absolute;inset:0;background:#faf7efed;display:flex;align-items:center;justify-content:center;padding:35px;text-align:center;z-index:3}#overlay.hidden{display:none}.eyebrow{font-size:11px;letter-spacing:3px;color:#83918b}h1{font-size:42px;line-height:1.22;letter-spacing:-2px;margin:23px 0}p{color:#6c7b77;font-size:14px;line-height:1.9}.start{background:#ed775c;color:white;border-radius:100px;padding:17px 45px;margin-top:22px;font-weight:650;box-shadow:0 8px 22px #ed775c26}.icon{font-size:64px;margin:22px 0}.foot{font-size:11px;color:#9b9f94;margin-top:28px}#hint{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));width:100%;text-align:center;color:#86928b;font-size:12px;pointer-events:none;letter-spacing:1px}
</style><main><header><div><small>剩余时间</small><b id="time">60</b><span> 秒</span></div><button id="pause" aria-label="暂停">Ⅱ</button><div><small>本局得分</small><b id="score">0</b></div></header><canvas id="game" aria-label="拖动托盘接物游戏"></canvas><div id="hint">← 在下方左右拖动托盘 →</div><section id="overlay"><div><div class="eyebrow">AI 同题挑战 · 01</div><div class="icon">▱</div><h1>再放一个<br>就走。</h1><p>接得住，也要稳得住。<br>拖动托盘，别让任何一件小物掉下来。<br>坚持 60 秒，看看你能带走多少。</p><button class="start" id="start">接好了，开始</button><div class="foot">单手操作 · 无需登录 · 随时重来</div></div></section></main><script type="module">const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function createGame(seed=12345){return {phase:'playing',elapsed:0,score:0,caught:0,x:200,v:0,tilt:0,items:[],next:1.4,seed,lastDrop:200,flash:0};}
const restartGame=createGame;
function random(s){s.seed=(Math.imul(s.seed,1664525)+1013904223)>>>0;return s.seed/4294967296;}
function spawn(s,x,type){let sizes=[[42,36],[30,40],[60,18]], [w,h]=sizes[type];s.items.push({x,y:Math.min(-50,...s.items.filter(a=>a.landed).map(a=>a.y-a.h/2-240)),w,h,type,vy:0,landed:false,stable:0,scored:false,offset:0});}
function stepGame(s,dt,targetX){if(s.phase!=='playing')return;s.elapsed+=dt;s.flash=Math.max(0,s.flash-dt);let old=s.v;s.v+=(clamp((targetX-s.x)*26,-650,650)-s.v)*Math.min(1,dt*26);s.x=clamp(s.x+s.v*dt,65,335);let accel=(s.v-old)/dt;s.tilt+=(clamp(-s.v*.00018,-.14,.14)-s.tilt)*Math.min(1,dt*7);
 s.next-=dt;if(s.next<=0){let range=s.elapsed<15?75:145;let x=clamp(s.lastDrop+(random(s)*2-1)*100,200-range,200+range);s.lastDrop=x;spawn(s,x,s.elapsed<15?0:Math.floor(random(s)*3));s.next=s.elapsed<15?2.5:s.elapsed<35?2.1:1.7;}
 for(let i=0;i<s.items.length;i++){let a=s.items[i];if(a.landed){a.offset+=(-accel*.0025+s.tilt*22)*dt*(1+i*.18)*(a.type===1?1.3:a.type===2?.8:1);a.x=s.x+a.offset;let base=510;for(let j=0;j<i;j++){let b=s.items[j];if(b.landed&&Math.abs(a.x-b.x)<(a.w+b.w)/2-5)base=Math.min(base,b.y-b.h/2);}a.y+=(base-a.h/2-a.y)*Math.min(1,dt*18);let support=Math.abs(a.y+a.h/2-510)<8?{x:s.x,w:130}:null;for(let j=0;j<i;j++){let b=s.items[j];if(b.landed&&Math.abs(a.x-b.x)<b.w/2-2&&Math.abs((a.y+a.h/2)-(b.y-b.h/2))<8)support=b;}if(!support||Math.abs(a.x-support.x)>support.w/2-2){a.landed=false;a.vy=30;}else{a.stable+=dt;if(!a.scored&&a.stable>.4){a.scored=true;s.caught++;s.score+=10+(Math.abs(a.offset)<22?5:0);s.flash=.2;}}}
 else{let prev=a.y+a.h/2;a.vy+=260*dt;a.y+=a.vy*dt;let base=510,support={x:s.x,w:130};for(let j=0;j<i;j++){let b=s.items[j];if(b.landed&&Math.abs(a.x-b.x)<(a.w+b.w)/2-7&&b.y-b.h/2<base){base=b.y-b.h/2;support=b;}}if(prev<=base&&a.y+a.h/2>=base&&Math.abs(a.x-support.x)<support.w/2-2){a.landed=true;a.touched=true;a.offset=a.x-s.x;a.y=base-a.h/2;a.vy=0;}if(a.y-a.h/2>595){s.reason=a.touched?'slip':'miss';s.phase='lost';return;}}
 }if(s.elapsed>=60){s.elapsed=60;s.phase='won';}}

function cameraZoom(s){const top=Math.min(510,...s.items.filter(a=>a.landed).map(a=>a.y-a.h/2));return Math.min(1,330/Math.max(330,510-top));}
function dragTarget(target,deltaPixels,width,zoom){return clamp(target+deltaPixels*400/width/zoom,65,335);}


const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay');let s=createGame(),started=false,target=200,last=0,acc=0,paused=false,ended=false,best=0;try{best=+localStorage.getItem('tray-best')||0;}catch{}
function resize(){let r=canvas.getBoundingClientRect();canvas.width=r.width*devicePixelRatio;canvas.height=r.height*devicePixelRatio;}addEventListener('resize',resize);resize();
function start(){down=false;s=createGame((Date.now()>>>0));target=200;started=true;paused=false;ended=false;acc=0;overlay.classList.add('hidden');}document.querySelector('#start').onclick=start;
function modal(title,body,label,action){overlay.innerHTML=`<div><div class="eyebrow">再放一个就走</div><h1>${title}</h1><p>${body}</p><button class="start">${label}</button><div class="foot">本机最高分 ${best}</div></div>`;overlay.classList.remove('hidden');overlay.querySelector('button').onclick=action;}
function pause(){if(!started||ended||paused)return;paused=true;down=false;activePointer=null;target=s.x;modal('先稳住。','小物和时间都替你停好了。','继续接物',()=>{paused=false;acc=0;overlay.classList.add('hidden');});}document.querySelector('#pause').onclick=pause;document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});addEventListener('blur',pause);
let down=false,lastPointerX=0,activePointer=null;
canvas.onpointerdown=e=>{if(!started||paused||ended||down)return;down=true;activePointer=e.pointerId;lastPointerX=e.clientX;target=s.x;canvas.setPointerCapture(e.pointerId);};
canvas.onpointermove=e=>{if(!down||e.pointerId!==activePointer)return;let r=canvas.getBoundingClientRect();target=dragTarget(target,e.clientX-lastPointerX,r.width,cameraZoom(s));lastPointerX=e.clientX;};
function release(e){if(activePointer!==e.pointerId)return;down=false;activePointer=null;if(e.type!=='pointerup')target=s.x;}
canvas.onpointerup=canvas.onpointercancel=canvas.onlostpointercapture=release;
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')target-=25;if(e.key==='ArrowRight')target+=25;if(e.key==='Escape')pause();});
function rect(x,y,w,h,color,r=7){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,r);ctx.fill();}
function draw(){let w=canvas.width,h=canvas.height;ctx.setTransform(w/400,0,0,h/700,0,0);ctx.clearRect(0,0,400,700);ctx.fillStyle='#e9e6dc';ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillText('ONE MORE. THEN WE GO.',200,130);let zoom=cameraZoom(s);
 if(started&&!ended){let p=s.items.find(a=>!a.landed&&a.y<120);if(p){let px=200+(p.x-200)*zoom;ctx.fillStyle='#769c90';ctx.beginPath();ctx.moveTo(px-6,155);ctx.lineTo(px+6,155);ctx.lineTo(px,163);ctx.fill();}}
 ctx.save();ctx.translate(200,520);ctx.scale(zoom,zoom);ctx.translate(-200,-520);ctx.strokeStyle="#dedfd3";ctx.setLineDash([3,6]);ctx.beginPath();ctx.moveTo(25,595);ctx.lineTo(375,595);ctx.stroke();ctx.setLineDash([]);ctx.save();ctx.translate(s.x,520);ctx.rotate(s.tilt);rect(0,9,145,13,'#eadbd0');rect(0,0,140,17,s.flash?'#f6aa83':'#ed775c');rect(0,-7,140,5,'#f69b7c',2);ctx.restore();
 for(let a of s.items){ctx.save();ctx.translate(a.x,a.y);if(a.landed)ctx.rotate(s.tilt*(1+Math.abs(a.offset)/50));ctx.shadowColor='#354c4020';ctx.shadowBlur=8;ctx.shadowOffsetY=4;rect(0,0,a.w,a.h,['#83aaa0','#e5b76e','#7a94ad'][a.type],a.type===1?4:5);ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.strokeStyle='#ffffff66';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-a.w/2+7,-a.h/2+7);ctx.lineTo(a.w/2-7,-a.h/2+7);ctx.stroke();if(a.type===0){ctx.strokeStyle='#ffffff55';ctx.beginPath();ctx.moveTo(0,-a.h/2);ctx.lineTo(0,a.h/2);ctx.stroke();}ctx.restore();}
 ctx.restore();let danger=s.items.some(a=>a.landed&&Math.abs(a.offset)>45);if(danger){ctx.fillStyle='#ed775c';ctx.font='12px system-ui';ctx.fillText('慢一点，稳住重心',200,635);}else{ctx.fillStyle='#b7beb1';ctx.font='11px system-ui';ctx.fillText('接在中央 +5',200,635);}}
function frame(t){let dt=Math.min((t-last)/1000||0,.1);last=t;if(started&&!paused&&!ended){acc+=dt;while(acc>=1/120){stepGame(s,1/120,target);acc-=1/120;}if(s.phase!=='playing'){ended=true;best=Math.max(best,s.score);try{localStorage.setItem('tray-best',best);}catch{}setTimeout(()=>modal(s.phase==='won'?'终于可以走了。':(s.reason==='slip'?'滑下去了。':'没接住。'),`接稳 ${s.caught} 件 · ${s.score} 分<br>${s.phase==='won'?'坚持了整整 60 秒':`坚持 ${Math.floor(s.elapsed)} 秒，差 ${Math.ceil(60-s.elapsed)} 秒就能走。`}`,s.phase==='won'?'再挑战':'再放一个',start),650);}}document.querySelector('#time').textContent=Math.ceil(60-s.elapsed);document.querySelector('#score').textContent=s.score;draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
